VIEW_SCHEMA = "db2dataprocessor_out"
VIEW_PREFIX = "v_"
VIEW_POSTFIX = "_last_version"
OUTPUT_FILENAME = "Database_Quality_Analysis"
COUNT_BATCH_SIZE = 100
INCLUDE_VALUE_DATETIME_COLUMNS = true

# Views matching these regular expressions are included automatically.
INCLUDED_VIEW_PATTERNS = [
  "^v_[a-z0-9_]+_last_version$",
  "^v_[a-z0-9_]+_fe_last_version$"
]

EXCLUDED_VIEW_PATTERNS = [
  "_raw_"
]

# Additional views that do not follow the last-version naming convention.
ADDITIONAL_VIEWS = [
  "v_pids_per_ward"
]

# Technical columns that should not appear in the report.
TECHNICAL_COLUMNS = [
  "raw_already_processed",
  "hash_index_col",
  "id",
  "last_version_date",
  "input_datetime",
  "last_check_datetime",
  "current_dataset_status",
  "input_processing_nr",
  "last_processing_nr"
]

# Table-specific grouping overrides. Format:
# table_name|resource_id_column|pid_column|case_id_column
#
# table_name is the normalized table name without view prefix/postfix, for example
# observation, patient_fe, fall_fe, or pids_per_ward.
GROUPING_OVERRIDES = [
  "patient|pat_id|pat_id|",
  "fall_fe|fall_fhir_enc_id|record_id|fall_id",
  "pids_per_ward|encounter_id|patient_id|encounter_id",
  "risikofaktor_fe|record_id|record_id|",
  "trigger_fe|record_id|record_id|",
  "medikationsanalyse_fe|meda_id|record_id|fall_meda_id"
]

# Optional resource detail sheets.
RESOURCE_DETAIL_SHEETS = [
  "ENCOUNTER"
]

RESOURCE_DETAIL_ENCOUNTER_SHEET_NAME = "FHIR Encounter"
RESOURCE_DETAIL_ENCOUNTER_TABLE_NAME = "encounter"

RESOURCE_DETAIL_ENCOUNTER_BLOCK_SYSTEM_COLUMN = "enc_type_system"
RESOURCE_DETAIL_ENCOUNTER_BLOCK_SYSTEM = "http://fhir.de/CodeSystem/Kontaktebene"
RESOURCE_DETAIL_ENCOUNTER_BLOCK_VALUE_COLUMN = "enc_type_code"
RESOURCE_DETAIL_ENCOUNTER_BLOCK_VALUES = [
  "Einrichtungskontakt=einrichtungskontakt",
  "Abteilungskontakt=abteilungskontakt",
  "Versorgungsstellenkontakt=versorgungsstellenkontakt"
]

RESOURCE_DETAIL_ENCOUNTER_SPLIT_SYSTEM_COLUMN = "enc_class_system"
RESOURCE_DETAIL_ENCOUNTER_SPLIT_SYSTEM = "http://terminology.hl7.org/CodeSystem/v3-ActCode"
RESOURCE_DETAIL_ENCOUNTER_SPLIT_VALUE_COLUMN = "enc_class_code"

# The left side is the report column, the right side is the value to filter for.
# The special value OTHER counts non-empty values outside the explicitly
# configured values.
RESOURCE_DETAIL_ENCOUNTER_SPLIT_VALUES = [
  "count class IMP=IMP",
  "count class SS=SS",
  "count class AMB=AMB",
  "count class Andere=OTHER"
]
