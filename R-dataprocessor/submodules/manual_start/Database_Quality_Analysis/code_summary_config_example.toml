# Optional additions to database_quality_analysis_config.toml.
INCLUDE_CODE_SUMMARY = true

# One query per resource report bounds intermediate data and logs resource progress.
# Medication and its usage resources stay together; scopes/targets share each query.
# CODE_SUMMARY_QUERY_BATCHING = "resource"  # "all" is available for comparison.

# Shared DQA logging: periodic elapsed-time messages while SQL is running.
# PROGRESS_INTERVAL_SECONDS = 60  # 0 disables the periodic timer.
# Sources, systems, report types and fields are configured in code_summary.toml here.
# A mapped numeric value column enables measurement statistics automatically.
# Optional source-level measurement = true/false overrides this detection there.
# To use a different file, select it here (relative to the repository root or absolute).
# CODE_SUMMARY_CONFIG_FILE = "path/to/code_summary.toml"

# Optional alternative Table Description (normally the installed cds2db file).
# CODE_SUMMARY_TABLE_DESCRIPTION = "path/to/Table_Description.xlsx"

# The existing FHIR filtered scope also enables additional IP-case CSVs in the same code ZIP.
# FILTERED_SCOPE_SHEET_NAMES = ["FHIR", "FHIR Encounter"]
# FILTERED_SCOPE_DETAIL_SHEET_SUFFIX = "INTERPOLAR"
