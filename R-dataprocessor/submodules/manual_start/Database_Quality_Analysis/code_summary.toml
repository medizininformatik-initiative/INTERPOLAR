# Maintained code-report configuration alongside the other DQA module TOMLs.
# Select another file with CODE_SUMMARY_CONFIG_FILE in the module configuration.
# System URIs are exact filters. WHO ATC is deliberately not included.
# SNOMED CT includes imported Coding paths only on the four report resources below.
[systems]
LOINC = ["http://loinc.org"]
ICD = ["http://fhir.de/CodeSystem/bfarm/icd-10-gm"]
OPS = ["http://fhir.de/CodeSystem/bfarm/ops"]
ATC = ["http://fhir.de/CodeSystem/bfarm/atc"]
PZN = ["http://fhir.de/CodeSystem/ifa/pzn"]
ASK = ["http://fhir.de/CodeSystem/ask"]
SNOMED = ["http://snomed.info/sct"]

# Behavior depends on the report type, not its name.
# coding: resource/patient/case counts; measurement: quantity/range statistics;
# medication: codes on Medication or a configured medication-link resource.
[report_types]
LOINC = "measurement"
ICD = "coding"
OPS = "coding"
ATC = "medication"
PZN = "medication"
ASK = "medication"
SNOMED = "coding"

# FHIR paths resolved using the Table Description, not DB-column naming guesses.
# {coding} is replaced with the source-specific Coding path.
# Candidate arrays select the first available path.
[fields]
resource_id = "id"
system = "{coding}/system"
version = "{coding}/version"
code = "{coding}/code"
pid = ["subject/reference", "patient/reference"]
case_id = ["encounter/calculated_ref", "context/calculated_ref"]
value = "valueQuantity/value"
unit = "valueQuantity/code"
unit_system = "valueQuantity/system"
low = "referenceRange/low/value"
high = "referenceRange/high/value"
range_type = "referenceRange/type/coding/code"

[normal_range]
code = "normal"
# Match the MRP selection: prefer the type code, regardless of its system.
# Use untyped ranges only when no explicitly normal range exists for the measurement.
fallback_to_missing_type = true

# Explicit sources take precedence over wildcard sources for the same system/path.
# measurement enables quantity statistics for all systems on this source.
[[sources]]
resource = "Observation"
coding = "code/coding"
reports = ["LOINC", "SNOMED"]
measurement = true

[[sources]]
resource = "Condition"
coding = "code/coding"
reports = ["ICD"]

[[sources]]
resource = "Procedure"
coding = "code/coding"
reports = ["OPS"]

[[sources]]
resource = "Medication"
coding = "code/coding"
reports = ["ATC", "PZN"]

[[sources]]
resource = "Medication"
coding = "ingredient/itemCodeableConcept/coding"
reports = ["ASK"]

# Coding paths are discovered via Table Description, within this explicit scope.
[[sources]]
resource = "Observation"
coding = "*"
reports = ["SNOMED"]

[[sources]]
resource = "Condition"
coding = "*"
reports = ["SNOMED"]

[[sources]]
resource = "Procedure"
coding = "*"
reports = ["SNOMED"]

[[sources]]
resource = "Medication"
coding = "*"
reports = ["SNOMED"]

# Direct medication codes feed Medication.csv, alongside Medication codes and linked counts.
# ASK remains restricted to Medication ingredients.
[[sources]]
resource = "MedicationRequest"
coding = "medicationCodeableConcept/coding"
reports = ["ATC", "PZN", "SNOMED"]

[[sources]]
resource = "MedicationAdministration"
coding = "medicationCodeableConcept/coding"
reports = ["ATC", "PZN", "SNOMED"]

[[sources]]
resource = "MedicationStatement"
coding = "medicationCodeableConcept/coding"
reports = ["ATC", "PZN", "SNOMED"]

# Sources can override common paths in a [sources.fields] table, or use actual
# DB columns in [sources.columns] when a FHIR-path mapping is ambiguous.
# For example, directly below an Observation source:
# [sources.columns]
# unit = "obs_valuequantity_code"

[[medication_links]]
resource = "MedicationRequest"
[medication_links.fields]
medication_ref = "medicationReference/reference"
case_id = "encounter/calculated_ref"

[[medication_links]]
resource = "MedicationAdministration"
[medication_links.fields]
medication_ref = "medicationReference/reference"
case_id = "context/calculated_ref"

[[medication_links]]
resource = "MedicationStatement"
[medication_links.fields]
medication_ref = "medicationReference/reference"
case_id = "context/calculated_ref"
