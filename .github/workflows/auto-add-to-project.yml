name: Add new issues and PRs to project
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/medizininformatik-initiative/projects/4  # Projekt-URL
          github-token: ${{ secrets.GITHUB_TOKEN }}
