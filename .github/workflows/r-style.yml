name: R style

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  r-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect R style scope
        id: style-scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" > changed-files.txt
          cat changed-files.txt

          if grep -Eq \
            '^(\.editorconfig|\.Rprofile|tools/(check-style|style[^/]*)\.R|\.github/workflows/r-style\.yml)$' \
            changed-files.txt; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif grep -Eq \
            '^(R-cds2db|R-cdstoolchain|R-dataprocessor|R-db2frontend|R-etlutils|Postgres-cds_hub/R-initcdstoolchain)/.*\.R$' \
            changed-files.txt; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.style-scope.outputs.mode != 'none'

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.style-scope.outputs.mode != 'none'
        with:
          packages: any::styler
          cache-version: 1

      - name: Check R style
        if: steps.style-scope.outputs.mode != 'none'
        env:
          INTERPOLAR_STYLE_BASE: ${{ github.event.pull_request.base.sha }}
        run: Rscript tools/check-style.R "${{ steps.style-scope.outputs.mode }}"

      - name: R style result
        run: echo "R style scope was ${{ steps.style-scope.outputs.mode }}."
