name: R style

on:
  pull_request:
  push:

jobs:
  r-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install styler
        shell: Rscript {0}
        run: |
          install.packages("styler", repos = "https://cloud.r-project.org")

      - name: Check R style
        run: Rscript tools/check-style.R
