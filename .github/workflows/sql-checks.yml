name: SQL checks

on:
  pull_request:
  push:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.sql-checks.outputs.format }}
      generated: ${{ steps.sql-checks.outputs.generated }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.sha }}" > changed-files.txt
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r \
              "${{ github.sha }}" > changed-files.txt
          else
            base_ref="${{ github.event.before }}"
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_ref}" || true
            fi
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin develop
              base_ref="$(git merge-base HEAD origin/develop)"
            fi
            git diff --name-only "${base_ref}" "${{ github.sha }}" > changed-files.txt
          fi

          cat changed-files.txt

      - name: Detect SQL checks
        id: sql-checks
        run: tools/detect-sql-checks.sh < changed-files.txt >> "$GITHUB_OUTPUT"

  sql-format:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.format == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install pgFormatter
        run: sudo tools/install-pgformatter.sh

      - name: Check SQL formatting
        run: pg_format --version && tools/check-sql-format.sh

  generated-sql-drift:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.generated == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Build R runtime image
        run: docker build -t interpolar-r -f Dockerfile_R .

      - name: Check generated SQL is committed
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            interpolar-r \
            bash -lc 'apt-get update && apt-get install -y perl && tools/install-pgformatter.sh && bash tools/check-generated-sql.sh'
